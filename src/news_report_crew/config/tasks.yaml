research_task:
  description: >
    Research and gather the latest news and updates from web for {country}.
  expected_output: >
    A comprehensive report containing the most recent and relevant news articles, updates, and information from various online sources related to {country}. The report should be well-organized, accurate, and provide a clear overview of current events in {country}.
    - title: The title of the news article or update.
    - source: The source or website from which the news article or update was obtained.
    - date: The publication date of the news article or update.
    - summary: A brief summary of the news article or update, highlighting the key points and relevant information.
    - url: The URL link to the original news article or update for reference.
    - tags: A list of relevant tags or keywords associated with the news article or update, which can help categorize and organize the information.
    - additional_notes: Any additional notes or comments that may provide further context or insights related to the news article or update.
    - author: The author or journalist who wrote the news article or update.
  agent: news_reporter


